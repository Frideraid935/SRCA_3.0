<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="contenedor-login">
        <!-- ⚠️ quitamos action y method -->
        <form id="loginForm">
            <h2>Iniciar Sesión</h2>

            <div class="campo">
                <label for="usuario">Usuario:</label>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Nombre del Alumno, Profesor o Administrador"
                    required>
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Número de Control o Contraseña"
                    required>
            </div>

            <button type="submit" class="btn btn-success">Entrar</button>
        </form>
    </div>

    <!-- ✅ CARGAR EL JS -->
    <script src="../JS/login.js"></script>
</body>
</html>
