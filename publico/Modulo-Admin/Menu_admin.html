<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Administradores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/estilo-alumnos.css">
  <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            background: linear-gradient(to right, #f4f6f9, #dde6f0);
        }
        
        /* Menú lateral (manteniendo tus estilos) */
        .menu-lateral {
            width: 250px;
            background-color: #34495e;
            padding: 20px 0;
            color: white;
            display: flex;
            flex-direction: column;
        }
        
        /* Contenido principal */
        .contenido-principal {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
        }
        
        /* Contenedor del iframe */
        .contenedor-iframe {
            width: 100%;
            max-width: 900px;
            height: 90vh;
        }
        
        /* Iframe sin bordes ni fondo blanco */
        #contenido-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
            overflow: hidden;
        }
        
        /* Asegurar que el contenido del iframe ocupe todo el espacio */
        #contenido-iframe html, 
        #contenido-iframe body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: transparent;
        }
        
        /* Ajustar los formularios dentro del iframe */
        #contenido-iframe .contenedor-formulario {
            width: 100%;
            height: 100%;
            padding: 0;
            background-color: transparent;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <!-- Menú lateral -->
    <div class="menu-lateral">
        <div class="logo">
            <h2><i class="fas fa-users-cog"></i> Administradores</h2>
        </div>

        <a href="#" class="menu-item active" data-url="Registrar_admin.html">
            <i class="fas fa-user-plus"></i> Registrar Admin
        </a>

        <a href="#" class="menu-item" data-url="Eliminar_admin.html">
            <i class="fas fa-trash-alt"></i> Eliminar Admin
        </a>

        <a href="../menu_inicio/menu_inicio_admin.html" class="menu-item">
            <i class="fas fa-home"></i> Menú Principal
        </a>
        
        <a href="../menu_inicio/menu_inicio_admin.html" class="menu-item" style="margin-top: auto; background-color: rgba(231, 76, 60, 0.1);">
            <i class="fas fa-sign-out-alt"></i> Salir
        </a>
    </div>

    <!-- Contenido principal con iframe -->
    <div class="contenido-principal">
        <div class="contenedor-iframe">
            <iframe id="contenido-iframe"></iframe>
        </div>
    </div>

    <!-- Solo este script -->
    <script src="../JS/menu_admin.js"></script>
</body>
</html>
