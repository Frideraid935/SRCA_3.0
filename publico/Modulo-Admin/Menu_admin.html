<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Administradores</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/estilo-alumnos.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            background: linear-gradient(to right, #f4f6f9, #dde6f0);
        }

        .menu-lateral {
            width: 250px;
            background-color: #34495e;
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .menu-lateral h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .menu-item i {
            margin-right: 10px;
        }

        .menu-item:hover,
        .menu-item.active {
            background-color: #2c3e50;
        }

        .contenido-principal {
            flex: 1;
            padding: 20px;
        }

        .contenedor-iframe {
            width: 100%;
            height: 100%;
        }

        #contenido-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- MENÚ LATERAL -->
    <div class="menu-lateral">
        <h2>Panel Admin</h2>

        <div class="menu-item active" data-url="Registrar_admin.html">
            <i class="fas fa-user-plus"></i> Registrar Admin
        </div>

        <div class="menu-item" data-url="Eliminar_admin.html">
            <i class="fas fa-trash-alt"></i> Eliminar Admin
        </div>

        <div class="menu-item" id="btn-inicio">
            <i class="fas fa-home"></i> Menú Principal
        </div>
    </div>

    <!-- CONTENIDO -->
    <div class="contenido-principal">
        <div class="contenedor-iframe">
            <iframe id="contenido-iframe" src="Registrar_admin.html"></iframe>
        </div>
    </div>

    <!-- JS -->
    <script src="../JS/menu_admin.js"></script>
</body>
</html>
