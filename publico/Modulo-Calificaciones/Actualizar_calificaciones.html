<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Calificación</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/estilo-alumnos.css">
</head>
<body>

<div class="contenedor-formulario active">
    <h2>Actualizar Calificación</h2>

    <div class="campo">
        <label>ID de Calificación</label>
        <input type="number" id="id_calificacion">
    </div>

    <div class="botones">
        <button id="btn-buscar" class="btn btn-primary">Buscar</button>
    </div>

    <form id="form-actualizar-calificacion" style="display:none;">
        <div class="grupo-campos">
            <div class="campo">
                <label>Nombre del Alumno</label>
                <input type="text" id="alumno_nombre">
            </div>

            <div class="campo">
                <label>Número de Control</label>
                <input type="text" id="numero_control">
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label>ID Materia</label>
                <input type="number" id="materia_id">
            </div>

            <div class="campo">
                <label>Calificación</label>
                <input type="number" step="0.1" min="0" max="10" id="calificacion">
            </div>
        </div>

        <div class="campo">
            <label>ID Profesor</label>
            <input type="text" id="profesor_id">
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-success">Actualizar</button>
        </div>

        <div id="mensaje" class="mensaje"></div>
    </form>
</div>

<script src="../JS/calificaciones.js"></script>
</body>
</html>
