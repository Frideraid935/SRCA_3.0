<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
</head>
<body>

<div class="contenedor-formulario">

    <div class="form-header">
        <h2>Actualizar Calificación</h2>
        <button class="search-btn" id="btn-buscar">Buscar</button>
    </div>

    <div class="campo">
        <label>ID de Calificación</label>
        <input type="number" id="id_buscar">
    </div>

    <table class="tabla-datos" id="tabla-calificaciones" style="display:none;">
        <thead>
            <tr>
                <th>Alumno</th>
                <th>Materia</th>
                <th>Calificación</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <form id="formulario-actualizar" style="display:none;">
        <div class="grupo-campos">
            <div class="campo">
                <label>Alumno</label>
                <input type="text" id="alumno_nombre_actualizar" readonly>
            </div>

            <div class="campo">
                <label>Calificación</label>
                <input type="number" step="0.1" id="calificacion_actualizar">
            </div>
        </div>

        <div class="botones">
            <button type="button" class="btn btn-success" onclick="actualizarCalificacion()">Actualizar</button>
        </div>

        <div id="mensaje-actualizar" class="mensaje"></div>
    </form>

</div>

<script src="../JS/calificaciones.js"></script>
</body>
</html>
