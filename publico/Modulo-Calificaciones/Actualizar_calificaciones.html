<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
    <script src="../JS/calificaciones.js" defer></script>
</head>
<body>
<div class="contenedor-formulario active">
    <h2>Actualizar Calificación</h2>

    <div class="grupo-campos">
        <div class="campo">
            <label>Alumno:</label>
            <input type="text" id="alumno_nombre_actualizar_buscar" required>
        </div>
        <div class="campo">
            <label>Materia:</label>
            <input type="text" id="materia_nombre_actualizar_buscar" required>
        </div>
    </div>

    <div class="botones">
        <button class="btn btn-primary" id="btn-buscar-actualizar">Buscar</button>
    </div>

    <form id="formulario-actualizar" style="display:none;">
        <input type="hidden" id="calificacion_id_actualizar">
        <div class="grupo-campos">
            <div class="campo">
                <label>Alumno:</label>
                <input type="text" id="alumno_nombre_actualizar" required>
            </div>
            <div class="campo">
                <label>Número de Control:</label>
                <input type="text" id="numero_de_control_actualizar" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label>Materia:</label>
                <input type="text" id="materia_nombre_actualizar" required>
            </div>
            <div class="campo">
                <label>Calificación (0-10):</label>
                <input type="number" id="calificacion_actualizar" min="0" max="10" step="0.1" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label>Profesor:</label>
                <input type="text" id="profesor_nombre_actualizar" required>
            </div>
        </div>

        <div class="botones">
            <button type="button" id="btn-actualizar" class="btn btn-success">Actualizar</button>
            <button type="reset" class="btn btn-primary">Limpiar</button>
        </div>

        <div id="mensaje-actualizar" class="mensaje"></div>
    </form>
</div>
</body>
</html>
