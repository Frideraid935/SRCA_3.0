<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
    <script src="../JS/calificaciones.js" defer></script>
</head>
<body>

<div class="contenedor-formulario active">
    <h2>Actualizar Calificación</h2>

    <div class="grupo-campos">
        <div class="campo">
            <label for="id_actualizar">ID de Calificación:</label>
            <input type="number" id="id_actualizar">
        </div>
    </div>

    <div class="botones">
        <button class="btn btn-primary" id="btn-buscar-actualizar">Buscar</button>
    </div>

    <form id="formulario-actualizar" style="display:none;">
        <div class="grupo-campos">
            <!-- Alumno -->
            <div class="campo">
                <label for="alumno_nombre_actualizar">Alumno:</label>
                <select id="alumno_nombre_actualizar" required></select>
            </div>

            <div class="campo">
                <label for="numero_de_control_actualizar">Número de Control:</label>
                <input type="text" id="numero_de_control_actualizar" readonly required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label for="materia_id_actualizar">Materia:</label>
                <select id="materia_id_actualizar" required></select>
            </div>

            <div class="campo">
                <label for="calificacion_actualizar">Calificación:</label>
                <input type="number" id="calificacion_actualizar" min="0" max="10" step="0.1" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label for="profesor_nombre_actualizar">Profesor:</label>
                <select id="profesor_nombre_actualizar" required></select>
            </div>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-success">Actualizar</button>
            <button type="reset" class="btn btn-primary">Limpiar</button>
        </div>

        <div id="mensaje-actualizar" class="mensaje"></div>
    </form>
</div>

</body>
</html>
