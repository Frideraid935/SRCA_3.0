<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
    <script src="../JS/calificaciones.js" defer></script>
</head>
<body>

<div class="contenedor-formulario active">
    <h2>Ingresar Calificación</h2>

    <form id="formulario-ingresarP" class="form">
        <div class="grupo-campos">
            <div class="campo">
                <label for="alumno_nombre_ingresar">Alumno:</label>
                <select id="alumno_nombre_ingresar" required></select>
            </div>

            <div class="campo">
                <label for="numero_de_control_ingresar">Número de Control:</label>
                <input type="text" id="numero_de_control_ingresar" readonly required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label for="materia_id_ingresar">Materia:</label>
                <select id="materia_id_ingresar" required></select>
            </div>

            <div class="campo">
                <label for="calificacion_ingresar">Calificación (0-10):</label>
                <input type="number" id="calificacion_ingresar" min="0" max="10" step="0.1" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label for="profesor_nombre_ingresar">Profesor:</label>
                <select id="profesor_nombre_ingresar" required></select>
            </div>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="reset" class="btn btn-primary">Limpiar</button>
        </div>

        <div id="mensaje-ingresar" class="mensaje"></div>
    </form>
</div>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const alumnoSelect = document.getElementById("alumno");
  const numeroControlInput = document.getElementById("numero_control");
  const materiaSelect = document.getElementById("materia");
  const profesorSelect = document.getElementById("profesor");

  // 1. Cargar alumnos
  const alumnos = await fetch("/api/alumnos/listar").then(res => res.json());
  alumnos.forEach(a => {
    const option = document.createElement("option");
    option.value = a.numero_de_control;
    option.textContent = a.nombre;
    alumnoSelect.appendChild(option);
  });

  // Actualizar número de control al cambiar alumno
  alumnoSelect.addEventListener("change", () => {
    numeroControlInput.value = alumnoSelect.value;
  });

  // 2. Cargar materias
  const materias = await fetch("/api/materias/listar").then(res => res.json());
  materias.forEach(m => {
    const option = document.createElement("option");
    option.value = m.id;
    option.textContent = m.nombre;
    materiaSelect.appendChild(option);
  });

  // 3. Cargar profesores
  const profesores = await fetch("/api/profesores/listar").then(res => res.json());
  profesores.forEach(p => {
    const option = document.createElement("option");
    option.value = p.numero_de_control;
    option.textContent = p.nombre;
    profesorSelect.appendChild(option);
  });

  // 4. Registrar calificación
  document.getElementById("formulario-calificaciones").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {
      alumno_nombre: alumnoSelect.selectedOptions[0].textContent,
      numero_de_control: numeroControlInput.value,
      materia_id: materiaSelect.value,
      calificacion: document.getElementById("calificacion").value,
      profesor_id: profesorSelect.value
    };

    const resp = await fetch("/api/calificaciones/registrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(r => r.json());

    if (resp.success) alert("Calificación registrada");
    else alert("Error: " + resp.message);
  });
});
</script>

</body>
</html>
