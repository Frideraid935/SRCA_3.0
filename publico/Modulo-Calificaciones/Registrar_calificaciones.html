<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
    <script src="../JS/calificaciones.js" defer></script>
</head>
<body>

<div class="contenedor-formulario active">
    <h2>Ingresar Calificación</h2>

    <form id="formulario-ingresar" class="form">
        <!-- Alumno -->
        <div class="grupo-campos">
            <div class="campo">
                <label for="alumno_nombre_ingresar">Alumno:</label>
                <select id="alumno_nombre_ingresar"></select>
                <input type="text" id="alumno_nombre_manual" placeholder="Escriba nombre si no hay opción" style="margin-top:5px;">
            </div>
            <div class="campo">
                <label for="numero_de_control_ingresar">Número de Control:</label>
                <input type="text" id="numero_de_control_ingresar" placeholder="Ingrese número de control" required>
            </div>
        </div>

        <!-- Materia -->
        <div class="grupo-campos">
            <div class="campo">
                <label for="materia_id_ingresar">Materia:</label>
                <select id="materia_id_ingresar"></select>
                <input type="text" id="materia_manual" placeholder="Escriba ID si no hay opción" style="margin-top:5px;">
            </div>
            <div class="campo">
                <label for="calificacion_ingresar">Calificación (0-10):</label>
                <input type="number" id="calificacion_ingresar" min="0" max="10" step="0.1" required>
            </div>
        </div>

        <!-- Profesor -->
        <div class="grupo-campos">
            <div class="campo">
                <label for="profesor_nombre_ingresar">Profesor:</label>
                <select id="profesor_nombre_ingresar"></select>
                <input type="text" id="profesor_manual" placeholder="Escriba número de control si no hay opción" style="margin-top:5px;">
            </div>
        </div>

        <!-- Botones -->
        <div class="botones">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="reset" class="btn btn-primary">Limpiar</button>
        </div>

        <div id="mensaje-ingresar" class="mensaje"></div>
    </form>
</div>

</body>
</html>
