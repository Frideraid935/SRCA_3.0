<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
</head>
<body>

<div class="contenedor-formulario">
    <h2>Registrar Calificación</h2>

    <form id="form-registrar-calificacion">
        <input type="text" id="alumno" placeholder="Nombre del alumno" required>
        <input type="text" id="control" placeholder="Número de control" required>
        <input type="number" id="materia" placeholder="ID Materia" required>
        <input type="number" id="calificacion" min="0" max="10" step="0.1" placeholder="Calificación" required>
        <input type="text" id="profesor" placeholder="Nombre del profesor" required>

        <button type="submit">Guardar</button>
        <div id="mensaje" class="mensaje"></div>
    </form>
</div>

<script src="../JS/calificaciones.js"></script>
</body>
</html>
