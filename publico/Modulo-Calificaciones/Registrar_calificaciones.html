<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Calificación</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/estilo-alumnos.css">
</head>
<body>

<div class="contenedor-formulario active">
    <h2>Ingresar Calificación</h2>

    <form id="form-registrar-calificacion">
        <div class="grupo-campos">
            <div class="campo">
                <label>Nombre del Alumno</label>
                <input type="text" id="alumno_nombre" required>
            </div>

            <div class="campo">
                <label>Número de Control</label>
                <input type="text" id="numero_control" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label>ID Materia</label>
                <input type="number" id="materia_id" required>
            </div>

            <div class="campo">
                <label>Calificación</label>
                <input type="number" step="0.1" min="0" max="10" id="calificacion" required>
            </div>
        </div>

        <div class="campo">
            <label>ID Profesor</label>
            <input type="text" id="profesor_id" required>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="reset" class="btn btn-primary">Limpiar</button>
        </div>

        <div id="mensaje" class="mensaje"></div>
    </form>
</div>

<script src="../JS/calificaciones.js"></script>
</body>
</html>
