<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
    <script src="../JS/calificaciones.js" defer></script>
</head>
<body>

<div class="contenedor-formulario">
    <h2>Registrar Calificación</h2>

    <form id="formulario-registrar" class="form">
        <div class="grupo-campos">
            <div class="campo">
                <label for="alumno_nombre_registrar">Alumno:</label>
                <input type="text" id="alumno_nombre_registrar" placeholder="Nombre del Alumno" required>
            </div>

            <div class="campo">
                <label for="numero_de_control_registrar">Número de Control:</label>
                <input type="text" id="numero_de_control_registrar" placeholder="Número de Control" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label for="materia_registrar">Materia:</label>
                <input type="text" id="materia_registrar" placeholder="Nombre de la Materia" required>
            </div>

            <div class="campo">
                <label for="calificacion_registrar">Calificación (0-10):</label>
                <input type="number" id="calificacion_registrar" min="0" max="10" step="0.1" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label for="profesor_registrar">Profesor:</label>
                <input type="text" id="profesor_registrar" placeholder="Nombre del Profesor" required>
            </div>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-success">Guardar</button>
            <button type="reset" class="btn btn-primary">Limpiar</button>
        </div>

        <div id="mensaje-registrar" class="mensaje"></div>
    </form>
</div>

</body>
</html>
