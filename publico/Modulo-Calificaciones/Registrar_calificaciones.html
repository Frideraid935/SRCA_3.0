<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar Calificación</title>
    <link rel="stylesheet" href="../css/estilo-calificaciones.css">
</head>
<body>

<div class="contenedor-formulario">
    <div class="form-header">
        <h2>Ingresar Calificación</h2>
    </div>

    <form id="formulario-ingresar">
        <div class="grupo-campos">
            <div class="campo">
                <label>Nombre del Alumno</label>
                <input type="text" id="alumno_nombre_ingresar" required>
            </div>

            <div class="campo">
                <label>Número de Control</label>
                <input type="text" id="numero_de_control_ingresar" required>
            </div>
        </div>

        <div class="grupo-campos">
            <div class="campo">
                <label>ID Materia</label>
                <input type="number" id="materia_id_ingresar" required>
            </div>

            <div class="campo">
                <label>Calificación</label>
                <input type="number" step="0.1" min="0" max="10" id="calificacion_ingresar" required>
            </div>
        </div>

        <div class="campo">
            <label>ID Profesor</label>
            <input type="text" id="profesor_id_ingresar" required>
        </div>

        <div class="botones">
            <button type="button" class="btn btn-success" onclick="guardarCalificacion()">Guardar</button>
            <button type="reset" class="btn btn-primary">Limpiar</button>
        </div>

        <div id="mensaje-ingresar" class="mensaje"></div>
    </form>
</div>

<script src="../JS/calificaciones.js"></script>
</body>
</html>
