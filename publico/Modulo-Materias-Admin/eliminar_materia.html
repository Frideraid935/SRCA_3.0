<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Materia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/estilo.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: transparent;
        }
        
        .contenedor-formulario {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        
        .advertencia {
            color: #dc3545;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background-color: #f8d7da;
            border-radius: 6px;
            border-left: 4px solid #dc3545;
        }
        
        .btn-eliminar {
            background-color: #dc3545;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-eliminar:hover {
            background-color: #c82333;
        }
        
        .btn-eliminar:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .mensaje {
            padding: 12px;
            margin: 15px 0;
            border-radius: 4px;
            display: none;
        }
        
        .mensaje-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .mensaje-error {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .mensaje-warning {
            background-color: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="contenedor-formulario">
        <h2 class="seccion-titulo">Eliminar Materia</h2>
        <br>
        
        <form id="form-eliminar-materia">
            <div class="campo">
                <label for="nombre-materia">Nombre de la Materia a Eliminar:</label>
                <input type="text" id="nombre-materia" placeholder="Ej: Matemáticas, Física, etc." required>
            </div>
            
            <div class="advertencia">
                <i class="fas fa-exclamation-triangle"></i> 
                ADVERTENCIA: Esta acción eliminará permanentemente la materia. No se puede deshacer.
            </div>
            
            <div class="botones">
                <button type="submit" class="btn-eliminar" id="btn-eliminar">
                    <i class="fas fa-trash-alt"></i> ELIMINAR MATERIA
                </button>
            </div>
        </form>
        
        <div id="mensaje-eliminar" class="mensaje"></div>
    </div>

    <script src="../JS/materias.js"></script>
</body>
</html>
