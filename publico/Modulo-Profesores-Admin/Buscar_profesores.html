<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Profesor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <div class="contenedor-formulario active">
        <h2>Buscar Profesor</h2>
        <form id="formulario-buscar">
            <div class="grupo-campos">
                <div class="campo">
                    <label for="busqueda-numero">Número de Control:</label>
                    <input type="text" id="busqueda-numero" name="numero_de_control" placeholder="Ingrese número de control">
                </div>
            </div>
            <div class="botones">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </form>
        
        <div id="resultados-busqueda" style="margin-top: 20px; display: none;">
            <h3>Datos del Profesor</h3>
            <div id="datos-profesor"></div>
        </div>
        
        <div id="mensaje-busqueda" class="mensaje"></div>
    </div>

    <script src="../JS/profesores.js"></script>
</body>
</html>
