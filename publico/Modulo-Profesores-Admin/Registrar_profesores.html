<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Profesor</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h2>Registrar Profesor</h2>
        <form id="formulario-ingresar">
            <div class="grupo-campos">
                <div class="campo">
                    <label for="numero_de_control_ingresar">Número de Control:</label>
                    <input type="text" id="numero_de_control_ingresar" placeholder="Ej: 20240001" required>
                </div>
                <div class="campo">
                    <label for="nombre_ingresar">Nombre:</label>
                    <input type="text" id="nombre_ingresar" placeholder="Nombre completo" required>
                </div>
            </div>
            
            <div class="grupo-campos">
                <div class="campo">
                    <label for="especialidad_ingresar">Especialidad:</label>
                    <input type="text" id="especialidad_ingresar" placeholder="Especialidad" required>
                </div>
            </div>
            
            <div class="botones">
                <button type="button" class="btn btn-success" onclick="guardarProfesor()">Guardar</button>
                <button type="reset" class="btn btn-primary">Limpiar</button>
            </div>
            <div id="mensaje-ingresar" class="mensaje"></div>
        </form>
    </div>

    <script src="../JS/profesores.js"></script>
</body>
</html>
