<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Salón</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<div class="contenedor-formulario">
    <h2>Buscar Salón</h2>

    <form id="formulario-buscar-salon" class="grupo-campos">
        <div class="campo">
            <label for="id_salon_buscar">ID del Salón</label>
            <input type="number" id="id_salon_buscar" name="id_salon" required min="1" placeholder="Ej: 1">
        </div>
        <div class="botones">
            <button type="submit" class="btn">Buscar</button>
            <button type="button" class="btn btn-secundario" onclick="limpiarBusqueda()">Limpiar</button>
        </div>
    </form>

    <div id="mensaje-busqueda" class="mensaje" style="display: none;"></div>
    
    <div id="resultado-salon" class="resultado-contenedor" style="display: none;">
        <h3>Información del Salón</h3>
        <div id="datos-salon">
            <!-- Los datos se cargarán aquí -->
        </div>
    </div>
</div>

<script src="../JS/buscar-salon.js"></script>
<script>
    function limpiarBusqueda() {
        document.getElementById('id_salon_buscar').value = '';
        document.getElementById('resultado-salon').style.display = 'none';
        document.getElementById('mensaje-busqueda').style.display = 'none';
        document.getElementById('datos-salon').innerHTML = '';
    }
</script>
</body>
</html>
