<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Salón</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<div class="contenedor-formulario">
    <h2>Buscar Salón</h2>

    <form id="formulario-buscar-salon" class="grupo-campos">
        <div class="campo">
            <label for="id_salon">ID del Salón</label>
            <input type="number" id="id_salon" name="id_salon" required min="1">
        </div>
        <div class="botones">
            <button type="submit" class="btn">Buscar</button>
            <button type="button" class="btn btn-secundario" onclick="limpiarBusqueda()">Limpiar</button>
        </div>
    </form>

    <div id="mensaje-busqueda-salon" class="mensaje" style="display:none;"></div>
    
    <div id="contenedor-datos-salon" style="display:none; margin-top:20px; padding:15px; background:#f5f5f5; border-radius:5px;">
        <h3>Información del Salón</h3>
        <div id="datos-salon">
            <!-- Los datos se mostrarán aquí -->
        </div>
    </div>
</div>

<script src="../JS/salones.js"></script>
<script>
    // Función para limpiar la búsqueda
    function limpiarBusqueda() {
        document.getElementById('id_salon').value = '';
        document.getElementById('contenedor-datos-salon').style.display = 'none';
        document.getElementById('mensaje-busqueda-salon').style.display = 'none';
    }
</script>
</body>
</html>
