<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Salón</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<div class="contenedor-formulario">
    <h2>Buscar Salón</h2>

    <!-- NO submit -->
    <form id="formulario-buscar-salon" class="grupo-campos">

        <div class="campo">
            <label>Nombre del Salón</label>
            <input type="text" id="buscar-nombre" required>
        </div>

        <div class="botones">
            <!-- IMPORTANTE -->
            <button type="button" id="btn-buscar-salon" class="btn">
                Buscar
            </button>
        </div>

    </form>

    <div id="mensaje-busqueda-salon" class="mensaje"></div>

    <!-- AQUÍ SE MUESTRA LA INFO -->
    <div id="datos-salon" style="display:none; margin-top:15px;"></div>
</div>

<script src="../JS/salones.js"></script>
</body>
</html>
