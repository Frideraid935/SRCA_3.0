<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Salón</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<div class="contenedor-formulario">
    <h2>Eliminar Salón</h2>

    <form id="formulario-eliminar-salon" class="grupo-campos">
        <div class="campo">
            <label>ID del Salón</label>
            <input type="number" id="id_salon_eliminar" required>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-danger">Eliminar</button>
        </div>
    </form>

    <div id="mensaje-eliminar" class="mensaje"></div>
</div>

<script src="../JS/salones.js"></script>
</body>
</html>
