<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Salón</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<h2>Registrar Salón</h2>

<form id="form-registrar-salon">
    <label>ID del Salón</label>
    <input type="number" id="id_salon" required>

    <label>Nombre del Salón</label>
    <input type="text" id="nombre_salon" required>

    <label>Número de Control del Profesor</label>
    <input type="number" id="numero_control_profesor" required>

    <button type="submit">Registrar</button>
</form>

<div id="mensaje"></div>

<script src="../JS/salones.js"></script>
</body>
</html>
