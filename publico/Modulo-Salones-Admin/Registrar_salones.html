<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Salón</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<div class="contenedor-formulario">
    <h2>Registrar Salón</h2>

    <form id="formulario-registrar-salon" class="grupo-campos">

        <div class="campo">
            <label>Nombre del salón</label>
            <input type="text" id="nombre_salon" required>
        </div>

        <div class="campo">
            <label>Capacidad</label>
            <input type="number" id="capacidad" required>
        </div>

        <div class="campo">
            <label>No. Control del Profesor</label>
            <input type="text" id="numero_de_control" required>
        </div>

        <div class="botones">
            <button type="submit" class="btn">Registrar</button>
        </div>

    </form>

    <div id="mensaje-registrar" class="mensaje"></div>
</div>

<script src="../JS/salones.js"></script>
</body>
</html>
